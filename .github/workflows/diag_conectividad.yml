name: Diagnóstico de conectividad (temporal)

# Prueba qué fuentes oficiales responden desde los servidores de GitHub Actions.
# Se borra cuando se elija la fuente del monitor del Boletín Oficial.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probar fuentes
        run: |
          for u in \
            "https://www.boletinoficial.gob.ar/seccion/primera/20261103" \
            "https://boletinoficial.gob.ar/seccion/primera/20261103" \
            "https://otslist.boletinoficial.gob.ar/" \
            "https://www.boletinoficial.gob.ar/pdf/aviso/primera/349970/20261103" \
            "https://www.argentina.gob.ar/normativa/nacional/norma-431783" \
            "https://www.argentina.gob.ar/normativa/buscar?jurisdiccion=nacional&tipo_norma=resolucion&texto=discapacidad" \
            "https://servicios.infoleg.gob.ar/infolegInternet/verNorma.do?id=431783" \
            "https://datos.jus.gob.ar/" \
            "https://www.argentina.gob.ar/andis/estadisticas/datos-estadisticos"; do
            r=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s %{size_download}B" -L --connect-timeout 15 --max-time 40 -A "ObservatorioDiscapacidad/1.0" "$u" || echo "FALLO")
            echo "$r  $u" | tee -a "$GITHUB_STEP_SUMMARY"
          done
